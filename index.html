<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline' https://use.typekit.net https://p.typekit.net; font-src https://use.typekit.net https://p.typekit.net data:; script-src 'self' 'sha256-5ecbTRkvlkA4AT/8n6vMc3GcEOKzpWG98i5gi55AmF8='; connect-src 'self' https://use.typekit.net https://p.typekit.net; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://use.typekit.net/wyr4xvw.css">
<title>FSII Collection</title>
<style>
:root{--ink:#111111;--dim:#5c5c58;--rule:#111111;--hair:#d8d6cf;--field:#f1f0ec;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:#ffffff;}
body{background:#ffffff;color:var(--ink);
font-family:"grad",Georgia,'Times New Roman',serif;font-size:17px;line-height:1.5;}
.page{max-width:1240px;margin:0 auto;padding:34px 34px 100px;}
header{border-bottom:1.5px solid var(--rule);padding-bottom:14px;}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 24px;}
.brand{font-family:"acumin-pro",sans-serif;font-size:20px;font-weight:600;
letter-spacing:.02em;white-space:nowrap;}
.searchbar{margin-left:auto;font-family:"acumin-pro",sans-serif;font-size:15px;
color:var(--ink);background:#fff;border:none;border-bottom:1px solid var(--rule);
padding:7px 2px;min-width:180px;max-width:280px;outline:none;border-radius:0;
letter-spacing:.02em;}
.searchbar::placeholder{color:#a2a29c;}
#stamprow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
flex-wrap:wrap;}
.selectbtn{font-family:"acumin-pro",sans-serif;font-weight:400;
font-size:14px;letter-spacing:.06em;color:var(--dim);cursor:pointer;
background:none;border:none;padding:12px 0 0;white-space:nowrap;}
.selectbtn.on{color:var(--ink);}
.filterlabel{font-family:"acumin-pro",sans-serif;font-weight:400;font-size:12px;
letter-spacing:.14em;text-transform:uppercase;color:#a2a29c;align-self:center;margin-right:2px;}
.subrow{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:center;
border-bottom:1px solid var(--hair);padding:11px 0;}
.subrow a{font-family:"acumin-pro",sans-serif;font-weight:300;color:var(--dim);
text-decoration:none;font-size:15px;cursor:pointer;white-space:nowrap;}
.subrow a.on{color:var(--ink);border-bottom:1.5px solid var(--ink);}
#stamp{font-family:"acumin-pro",sans-serif;color:var(--dim);font-size:14px;
padding:12px 0 0;letter-spacing:.02em;}
#stamp .refresh{color:var(--ink);cursor:pointer;text-decoration:underline;
text-underline-offset:3px;}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:56px 44px;padding-top:44px;}
.card{cursor:pointer;position:relative;}
.card:active{opacity:.7;}
.ph{width:100%;aspect-ratio:1/1;background:var(--field);display:flex;
align-items:center;justify-content:center;margin-bottom:16px;}
.ph img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply;}
.noph{color:#b3372f;font-size:15px;letter-spacing:.14em;}
.cnm{font-size:19px;color:var(--ink);line-height:1.3;margin-bottom:8px;}
.cmeta{font-size:15px;color:var(--dim);line-height:1.42;}
.check{position:absolute;top:12px;left:12px;width:26px;height:26px;border-radius:50%;
border:1.5px solid var(--dim);background:rgba(255,255,255,.85);display:none;
align-items:center;justify-content:center;font-family:"acumin-pro",sans-serif;
font-size:15px;color:#fff;}
body.selmode .check{display:flex;}
.card.sel .check{background:var(--ink);border-color:var(--ink);}
.card.sel .ph{outline:2px solid var(--ink);outline-offset:3px;}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:80px 0;font-style:italic;}
/* selection action bar */
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;
display:none;align-items:center;gap:18px;background:var(--ink);color:#fff;
padding:14px 22px;border-radius:40px;font-family:"acumin-pro",sans-serif;
box-shadow:0 6px 24px rgba(0,0,0,.25);}
#selbar.show{display:flex;}
#selbar .n{font-size:15px;letter-spacing:.04em;}
#selbar button{font-family:"acumin-pro",sans-serif;font-size:14px;border:none;
cursor:pointer;border-radius:30px;padding:9px 18px;letter-spacing:.05em;}
#selbar .go{background:#fff;color:var(--ink);font-weight:600;}
#selbar .clr{background:none;color:#cfcfca;padding:9px 6px;}
/* detail */
#overlay{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:50;
display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#overlay.open{display:block;}
.sheet{max-width:1120px;margin:0 auto;padding:24px 40px 70px;position:relative;min-height:100vh;}
.dclose{position:fixed;top:20px;right:28px;width:48px;height:48px;cursor:pointer;
color:#b6b6b0;font-family:"acumin-pro",sans-serif;font-weight:200;font-size:42px;
line-height:46px;text-align:center;background:none;border:none;z-index:60;}
.dclose:hover{color:var(--dim);}
.dhead{font-family:"acumin-pro",sans-serif;font-size:18px;font-weight:600;
letter-spacing:.02em;border-bottom:1px solid var(--hair);padding:6px 0 12px;}
.dcols{display:grid;grid-template-columns:1fr 1.05fr;gap:44px;padding-top:30px;}
@media(max-width:760px){.dcols{grid-template-columns:1fr;}}
.dph{width:100%;aspect-ratio:1/1.1;background:var(--field);display:flex;
align-items:center;justify-content:center;}
.dph img{width:90%;height:90%;object-fit:contain;mix-blend-mode:multiply;}
.dnm{font-size:26px;color:var(--ink);line-height:1.2;margin-bottom:18px;}
.spec{width:100%;border-collapse:collapse;}
.spec tr{border-bottom:1px solid var(--hair);}
.spec tr:first-child{border-top:1px solid var(--hair);}
.spec td{padding:12px 4px;font-size:17px;color:var(--ink);vertical-align:top;}
.spec td.l{width:38%;}
.ddesc{margin-top:22px;font-size:16px;line-height:1.65;color:var(--ink);}
.dfoot{margin-top:52px;border-top:1px solid var(--hair);padding-top:18px;}
.dfoot .lbl{font-family:"acumin-pro",sans-serif;font-size:13px;letter-spacing:.1em;
text-transform:uppercase;color:var(--dim);margin-bottom:16px;}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px;}
.simgrid .st{cursor:pointer;}
.simgrid .st .simph{width:100%;aspect-ratio:1/1;background:var(--field);display:flex;
align-items:center;justify-content:center;margin-bottom:6px;}
.simgrid .st .simph img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply;}
.simgrid .st .simnm{font-size:13px;color:var(--dim);line-height:1.3;}
/* gate */
#gate{position:fixed;inset:0;background:#ffffff;z-index:100;display:flex;
align-items:center;justify-content:center;padding:24px;}
.gbox{width:100%;max-width:400px;border:1.5px solid var(--rule);padding:44px 38px 38px;text-align:left;}
.gbox h1{font-family:"acumin-pro",sans-serif;font-size:22px;font-weight:600;margin-bottom:2px;}
.gbox .gsub{color:var(--dim);font-size:16px;font-style:italic;margin-bottom:30px;}
.gbox input{width:100%;background:#fff;border:none;border-bottom:1px solid var(--rule);
color:var(--ink);padding:12px 2px;font-size:18px;margin-bottom:18px;outline:none;
font-family:inherit;border-radius:0;}
.gbox button{width:100%;background:var(--ink);color:#fff;border:none;padding:15px;
font-size:16px;cursor:pointer;margin-top:14px;font-family:"acumin-pro",sans-serif;letter-spacing:.08em;}
#gerr{color:#b3372f;font-size:15px;min-height:22px;margin-top:12px;font-style:italic;}
#app{display:none;}
/* print / hotsheet */
#printroot{display:none;}
@media print{
  @page{margin:14mm;}
  body>*{display:none !important;}
  #printroot{display:block !important;}
  .hspage{page-break-after:always;break-after:page;}
  .hspage:last-child{page-break-after:auto;}
  .hshead{font-family:"acumin-pro",sans-serif;font-size:12pt;font-weight:600;
    letter-spacing:.04em;border-bottom:1.5px solid #111;padding-bottom:6pt;margin-bottom:14pt;}
  .hsnm{font-family:"grad",Georgia,serif;font-size:20pt;margin-bottom:10pt;color:#111;}
  .hsimg{width:100%;max-height:120mm;object-fit:contain;margin-bottom:12pt;}
  .hsrow{border-top:1px solid #bbb;padding:5pt 0;font-size:11pt;color:#111;}
  .hsrow b{display:inline-block;width:34%;font-weight:600;}
  .hsdesc{margin-top:10pt;font-size:10.5pt;line-height:1.5;color:#111;}
}
</style>
</head>
<body>
<div id="gate"><div class="gbox">
<input id="gu" type="text" placeholder="Login" autocapitalize="none" autocorrect="off">
<input id="gp" type="password" placeholder="Password">
<button id="enterBtn">Enter</button>
<div id="gerr"></div>
</div></div>

<div id="app"><div class="page">
<header>
<div class="hrow">
<div class="brand">FSII Collection</div>
<input id="search" class="searchbar" type="search" placeholder="Search" autocapitalize="none" autocorrect="off">
</div>
</header>
<div class="subrow" id="typeBar"></div>
<div class="subrow" id="vitrineBar"></div>
<div class="subrow" id="deckBar"></div>
<div id="stamprow"><div id="stamp"></div><button class="selectbtn" id="selectbtn">Select items</button></div>
<main id="grid"></main>
</div>

<div id="selbar">
<span class="n" id="selcount">0 selected</span>
<button class="go" id="shareBtn">Share</button>
<button class="clr" id="clearBtn">Cancel</button>
</div>

<div id="overlay">
<button class="dclose" id="dcloseBtn" aria-label="Close">&#215;</button>
<div class="sheet"><div class="dhead">FSII Collection</div><div id="dbody"></div></div>
</div>
</div>

<div id="printroot"></div>

<script src="jspdf.umd.min.js" integrity="sha256-5lUfzcMvCdaFOyxRJtGNAdlEfg2mGKQaEevu4PbCDVQ=" crossorigin="anonymous"></script>
<script>
var ITER = 600000;
var KEY = null, ITEMS = [], STAMP_EPOCH = 0;
function b64buf(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function deriveKey(user,pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+':'+pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function fetchAndDecrypt(user,pass){var res=await fetch('data.enc?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('fetch');var raw=b64buf((await res.text()).trim());var salt=raw.slice(0,16),nonce=raw.slice(16,28),ct=raw.slice(28);var key=KEY||await deriveKey(user,pass,salt);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,ct);KEY=key;var obj=JSON.parse(new TextDecoder().decode(pt));ITEMS=obj.items;STAMP_EPOCH=obj.epoch;}
async function tryLogin(){var u=document.getElementById('gu').value.trim().toLowerCase();var p=document.getElementById('gp').value;var btn=document.querySelector('.gbox button');btn.textContent='Unlocking...';try{KEY=null;await fetchAndDecrypt(u,p);document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render();}catch(e){document.getElementById('gerr').textContent='Wrong username or password';document.getElementById('gp').value='';}btn.textContent='Enter';}
async function refresh(){var el=document.getElementById('refreshChip');if(el)el.textContent='Refreshing...';try{await fetchAndDecrypt();}catch(e){}render();}


function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var typeFilter='All', vitrineFilter='All', deckFilter='All', searchQuery='';
var vitrineOpts=['All','In Vitrine','Open','Closed'];
var deckOpts=['All','Deck 3','Deck 4','Deck 5','Deck 6','Deck 9','Deck 10','Deck 11'];
var selMode=false, selected={};

function chipRow(el,label,list,get,set){
  el.innerHTML='';
  if(label){var s=document.createElement('span');s.className='filterlabel';s.textContent=label;el.appendChild(s);}
  list.forEach(function(v){
    var a=document.createElement('a');a.className=get()===v?'on':'';a.textContent=v;
    a.onclick=function(){set(v);render();};el.appendChild(a);
  });
}
function match(i){
  if(typeFilter!=='All' && i.type!==typeFilter) return false;
  if(vitrineFilter==='In Vitrine' && !i.vitrine) return false;
  if(vitrineFilter==='Open' && i.vitrine!=='Open') return false;
  if(vitrineFilter==='Closed' && i.vitrine!=='Closed') return false;
  if(deckFilter!=='All' && String(i.deck)!==deckFilter.slice(5)) return false;
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    var hay=((i.name||'')+' '+(i.full||'')+' '+(i.rest||'')+' '+(i.type||'')+' '+
             (i.dims||'')+' '+(i.deck||'')+' '+(i.vitrine||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function placeLine(i){
  var p=[];
  if(i.deck) p.push('Deck '+esc(i.deck));
  if(i.vitrine) p.push('Vitrine '+esc(String(i.vitrine).toLowerCase()));
  return p.length?p.join(', '):'Placement TBD';
}
function fmtStamp(){
  try{return new Date(STAMP_EPOCH).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});}
  catch(e){return new Date(STAMP_EPOCH).toLocaleString();}
}
function renderStamp(shown){
  var el=document.getElementById('stamp');
  el.innerHTML = shown+' of '+ITEMS.length+' items · updated '+esc(fmtStamp())+
    ' · <span class="refresh" id="refreshTap">Tap to refresh</span>';
  var r=document.getElementById('refreshTap');
  r.onclick=function(){
    if(typeof refresh==='function'){ r.textContent='Refreshing…'; refresh(); }
    else { render(); }
  };
}

function render(){
  var types=['All'];
  ITEMS.forEach(function(i){if(i.type && types.indexOf(i.type)<0) types.push(i.type);});
  chipRow(document.getElementById('typeBar'),'Type',types,function(){return typeFilter;},function(v){typeFilter=v;});
  chipRow(document.getElementById('vitrineBar'),'Vitrine',vitrineOpts,function(){return vitrineFilter;},function(v){vitrineFilter=v;});
  chipRow(document.getElementById('deckBar'),'Deck',deckOpts,function(){return deckFilter;},function(v){deckFilter=v;});
  var shown=0,g=document.getElementById('grid');g.innerHTML='';
  ITEMS.forEach(function(i){
    if(!match(i)) return;
    shown++;
    var card=document.createElement('div');
    card.className='card'+(selected[i.acc]?' sel':'');
    var meta='<div>'+esc(i.type)+'</div>';
    if(i.dims) meta+='<div>'+esc(i.dims)+'</div>';
    if(i.weight) meta+='<div>'+esc(i.weight)+' kg</div>';
    meta+='<div>'+placeLine(i)+'</div>';
    card.innerHTML=
      '<div class="check">'+(selected[i.acc]?'✓':'')+'</div>'+
      '<div class="ph">'+(i.img?'<img loading="lazy" src="'+esc(i.img)+'">':'<div class="noph">NO PHOTO</div>')+'</div>'+
      '<div class="cnm">'+esc(i.name)+'</div>'+
      '<div class="cmeta">'+meta+'</div>';
    card.onclick=(function(item){return function(){
      if(selMode) toggleSel(item.acc); else openDetail(item);
    };})(i);
    g.appendChild(card);
  });
  if(!shown) g.innerHTML='<div class="empty">Nothing here yet</div>';
  renderStamp(shown);
}

/* selection */
function toggleSelectMode(){
  selMode=!selMode;
  document.body.classList.toggle('selmode',selMode);
  document.getElementById('selectbtn').textContent=selMode?'Done':'Select items';
  document.getElementById('selectbtn').classList.toggle('on',selMode);
  if(!selMode) clearSel();
  render(); updateSelbar();
}
function toggleSel(acc){ if(selected[acc]) delete selected[acc]; else selected[acc]=true; render(); updateSelbar(); }
function clearSel(){ selected={}; render(); updateSelbar(); }
function updateSelbar(){
  var n=Object.keys(selected).length;
  document.getElementById('selcount').textContent=n+(n===1?' selected':' selected');
  document.getElementById('selbar').className=(selMode&&n>0)?'show':'';
}

/* export: selected items -> one PDF -> iPad Share sheet (WhatsApp / Mail live there).
   Text is DRAWN into the PDF by jsPDF, never parsed as HTML, so cell content
   cannot execute. */
function buildPdf(items){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:'pt',format:'a4'});
  var W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=48;
  items.forEach(function(i,idx){
    if(idx>0) doc.addPage();
    var y=M;
    doc.setTextColor(17);
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('FSII COLLECTION', M, y); y+=8;
    doc.setDrawColor(17); doc.setLineWidth(1); doc.line(M,y,W-M,y); y+=26;
    doc.setFont('times','normal'); doc.setFontSize(20);
    var nm=doc.splitTextToSize(String(i.name||''), W-2*M);
    doc.text(nm, M, y); y+=nm.length*22+10;
    if(i.img){
      try{
        var pr=doc.getImageProperties(i.img);
        var r=Math.min((W-2*M)/pr.width, 300/pr.height);
        var iw=pr.width*r, ih=pr.height*r;
        doc.addImage(i.img,'JPEG', M, y, iw, ih); y+=ih+20;
      }catch(e){}
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    function line(l,v){ if(v!==''&&v!=null){ doc.setFont('helvetica','bold');
      doc.text(l+':', M, y); doc.setFont('helvetica','normal');
      doc.text(doc.splitTextToSize(String(v), W-2*M-92), M+92, y); y+=17; } }
    line('Type',i.type); line('Dimensions',i.dims);
    line('Weight', i.weight?i.weight+' kg':'');
    line('Count', i.count&&i.count>1?i.count+' pieces':'');
    line('Deck', i.deck?'Deck '+i.deck:''); line('Vitrine', i.vitrine||'');
    var desc=i.rest||i.full||'';
    if(desc){ y+=10; doc.setFontSize(10.5);
      doc.text(doc.splitTextToSize(String(desc), W-2*M), M, y); }
  });
  var blob=doc.output('blob');
  return new File([blob], 'FSII-selection.pdf', {type:'application/pdf'});
}
function shareSelection(){
  var chosen=ITEMS.filter(function(i){return selected[i.acc];});
  if(!chosen.length) return;
  var btn=document.getElementById('shareBtn'); var old=btn.textContent;
  btn.textContent='Preparing…';
  setTimeout(function(){
    var file;
    try{ file=buildPdf(chosen); }
    catch(e){ btn.textContent=old; return; }
    btn.textContent=old;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'FSII selection'}).catch(function(){});
    } else {
      var url=URL.createObjectURL(file), a=document.createElement('a');
      a.href=url; a.download=file.name; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},4000);
    }
  }, 30);
}
function cancelSel(){ selected={}; selMode=false;
  document.body.classList.remove('selmode');
  document.getElementById('selectbtn').textContent='Select items';
  document.getElementById('selectbtn').classList.remove('on');
  render(); updateSelbar(); }

/* detail */
function openDetail(i){
  var rows=[];
  function row(l,v){ if(v!==''&&v!=null) rows.push('<tr><td class="l">'+esc(l)+'</td><td class="v">'+esc(v)+'</td></tr>'); }
  row('Type',i.type); row('Dimensions',i.dims);
  row('Weight', i.weight?i.weight+' kg':'');
  row('Count', i.count&&i.count>1?i.count+' pieces':'');
  row('Deck', i.deck?'Deck '+i.deck:'Not decided yet'); row('Vitrine', i.vitrine||'');
  var sims=[];
  ITEMS.forEach(function(o){ if(o.acc!==i.acc && o.type===i.type && sims.length<8 && o.img) sims.push(o); });
  var simHtml=sims.map(function(o){
    return '<div class="st" data-acc="'+esc(o.acc)+'"><div class="simph"><img src="'+esc(o.img)+'"></div>'+
      '<div class="simnm">'+esc(o.name)+'</div></div>';
  }).join('');
  var rest=i.rest||'';
  document.getElementById('dbody').innerHTML=
    '<div class="dcols">'+
    '<div class="dph">'+(i.img?'<img src="'+esc(i.img)+'">':'<div class="noph">NO PHOTO</div>')+'</div>'+
    '<div><div class="dnm">'+esc(i.name)+'</div>'+
    '<table class="spec">'+rows.join('')+'</table>'+
    (rest?'<div class="ddesc">'+esc(rest)+'</div>':'')+'</div>'+
    '</div>'+
    (sims.length?'<div class="dfoot"><div class="lbl">Similar pieces</div><div class="simgrid">'+simHtml+'</div></div>':'');
  document.querySelectorAll('.simgrid .st').forEach(function(el){
    el.onclick=function(){var it=ITEMS.filter(function(o){return o.acc===el.getAttribute('data-acc');})[0];
      if(it){openDetail(it);window.scrollTo(0,0);}};
  });
  document.getElementById('overlay').className='open';
  document.body.style.overflow='hidden'; window.scrollTo(0,0);
}
function closeDetail(){ document.getElementById('overlay').className=''; document.body.style.overflow=''; }
document.getElementById('overlay').onclick=function(e){ if(e.target.id==='overlay') closeDetail(); };
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeDetail();
  if(e.key==='Enter' && document.getElementById('gate').style.display!=='none') tryLogin();
});
/* handlers wired in JS (no inline on* attributes) so CSP can forbid inline script */
document.getElementById('enterBtn').onclick=tryLogin;
document.getElementById('selectbtn').onclick=toggleSelectMode;
document.getElementById('search').oninput=function(){searchQuery=this.value;render();};
document.getElementById('shareBtn').onclick=shareSelection;
document.getElementById('clearBtn').onclick=cancelSel;
document.getElementById('dcloseBtn').onclick=closeDetail;
</script>
</body>
</html>
